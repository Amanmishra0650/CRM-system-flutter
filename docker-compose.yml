services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: bike_rescue
      POSTGRES_USER: bike_rescue
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - bike_rescue_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bike_rescue -d bike_rescue"]
      interval: 5s
      retries: 10
volumes:
  bike_rescue_data:
